server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;   # ছবি/ভিডিও আপলোড (backend-এ সীমা ১৫MB)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # API ও health → backend কনটেইনারে
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /health {
        proxy_pass http://api:5000/health;
    }
    # sitemap আসে backend থেকে (আগে vercel.json করত)
    location = /sitemap.xml {
        proxy_pass http://api:5000/api/products/sitemap.xml;
        proxy_set_header Host $host;
    }

    # build করা ফাইলের নামে hash থাকে, তাই অনেকদিন cache করা যায়
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: অচেনা পাথ হলে index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
